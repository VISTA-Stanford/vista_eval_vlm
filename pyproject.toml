[project]
name = "inference"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "db-dtypes>=1.5.0",
    "google-cloud-bigquery>=3.40.0",
    "google-cloud-storage>=3.8.0",
    "nibabel>=5.3.3",
    "openslide-bin>=4.0.0.11",
    "openslide-python>=1.4.3",
    "pytest>=9.0.2",
    "reportlab>=4.4.9",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
# What tests/ imports beyond the base deps (models/ and run_bq import torch at module
# level). Pinned to requirements-default.txt. Run: uv sync --extra test && uv run pytest
test = [
    "torch==2.8.0",
    "pyyaml==6.0.3",
    "tqdm==4.67.1",
]

[tool.pytest.ini_options]
# src/ holds ad hoc scripts named test_*.py that need packages this project does not install.
testpaths = ["tests"]
