# Registry columns the died-2yr-ehr agent may see (index tumour only), in the shared exporter's allow-list format
# (vista-onc-labelers common/omop_export/export_omop.py; see its allowlist_example.yaml).
#
# Source: the registry audit, planning/vista_eval_vlm/session/2026-10-21-died-2yr-ehr-registry-audit.md on the
# mount (/mnt/su-vista-uscentral1/chaudhari_lab/phil/), its per-column table, with Phil's decisions of 2026-10-21
# (the doc's "Decided" block and the spec's Decided list) on top:
#   - KEEP columns stay. CUT-BY-DATE columns are governed by their date (the DATE-typed <date>_date column):
#     nulled unless that date is on or before the cutoff. A shown date governs itself.
#   - First-course treatment codes (surgery, radiation incl. intent, systemic, palliative, plan/sequence) KEEP with
#     no governing date (every first-course date is after the cutoff by construction). The first-course treatment
#     date columns and their blank-reason flags are not listed.
#   - DROP: treatment free text (rxtext*, stanfordtextprotocol, nmtexthemtransplantendocrine), diagnosis-workup
#     free text (textdxproc*, textstaging, textfinaldx), pathologic stage and surgical-pathology findings,
#     derived/summary stage for everyone, stanfordadditionaltext, eventnotes, and every outcome, follow-up and
#     later-line field (the audit's DROP bucket).
#   - Kept as the audit recommended: classofcase, protocolparticipation, title/place/payer/occupation text.
#   - Left out for now (open items, see TASK_NOTES.md):
#       secondarydiagnosis1-10: Phil kept them minus treatment-complication codes, which the audit found by ICD-10
#         prefix (^(T8[0-8]|Y8[34]|J95|I97|K91|N99|E89|G97|D78|H59|H95|L76|M96)); the exporter has no value
#         filter, so they are out until it does. Comorbidities are still in the OMOP condition table.
#       yearfirstseen: governed by dateof1stcontact, which lives in the outcomes table; the exporter governs only
#         within a table.
# A code column's "...description" twin takes the code column's decision. Events: rows after the cutoff dropped.
# Generated from the audit's machine-readable classification; edit by hand from here on.
